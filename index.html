<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jimpitan">
    <meta name="application-name" content="Jimpitan Digital">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a1628">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    
    <title>Jimpitan Digital</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1628;
            color: #e6f1ff;
            min-height: 100vh;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 480px; margin: 0 auto; }
        
        .header { text-align: center; padding: 10px 0 14px; }
        .header h1 { 
            font-size: 20px; 
            color: #64ffda;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header h1 .logo {
            display: inline-block;
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #64ffda, #00b894);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #0a1628;
        }
        
        .card {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        
        .form-group { margin-bottom: 10px; }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #e6f1ff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-control:focus { border-color: #64ffda; }
        .form-control option { background: #0a1628; }
        .form-control option:disabled { color: #495670; opacity: 0.6; }
        
        .jenis-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .jenis-btn {
            padding: 10px;
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            color: #8892b0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .jenis-btn .icon { display: block; font-size: 18px; margin-bottom: 2px; }
        .jenis-btn.active.bayar {
            border-color: #64ffda;
            background: rgba(100,255,218,0.1);
            color: #64ffda;
        }
        .jenis-btn.active.ambil {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.1);
            color: #ff6b6b;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin: 8px 0;
            max-height: 320px;
            overflow-y: auto;
            padding: 2px;
        }
        .calendar-grid::-webkit-scrollbar { width: 3px; }
        .calendar-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        .calendar-grid::-webkit-scrollbar-thumb { background: #64ffda; border-radius: 4px; }
        
        .date-checkbox {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: rgba(255,255,255,0.04);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }
        .date-checkbox:hover { background: rgba(255,255,255,0.08); border-color: rgba(100,255,218,0.2); }
        .date-checkbox.checked { border-color: #64ffda; background: rgba(100,255,218,0.1); }
        .date-checkbox.checked .date-label { color: #64ffda; }
        .date-checkbox .date-label { flex: 1; color: #ccd6f6; font-weight: 500; font-size: 11px; }
        .date-checkbox .date-day { font-size: 8px; color: #495670; }
        .date-checkbox input[type="checkbox"] { width: 14px; height: 14px; accent-color: #64ffda; cursor: pointer; flex-shrink: 0; }
        
        .date-checkbox.paid {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: rgba(100,255,218,0.15);
            background: rgba(100,255,218,0.03);
        }
        .date-checkbox.paid .date-label { color: #495670; text-decoration: line-through; }
        .date-checkbox.paid input[type="checkbox"] { accent-color: #495670; cursor: not-allowed; }
        .date-checkbox.paid .badge-paid { font-size: 8px; background: rgba(100,255,218,0.1); color: #64ffda; padding: 1px 5px; border-radius: 10px; }
        
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            margin-bottom: 4px;
        }
        .month-nav .month-label { font-size: 14px; font-weight: 600; color: #e6f1ff; }
        .month-nav .nav-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 3px 10px;
            color: #ccd6f6;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .month-nav .nav-btn:hover { background: rgba(255,255,255,0.12); }
        
        .summary-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
            padding: 8px 12px;
            background: rgba(100,255,218,0.05);
            border-radius: 6px;
            border: 1px solid rgba(100,255,218,0.08);
        }
        .summary-bar .item { text-align: center; }
        .summary-bar .item .label { font-size: 9px; color: #8892b0; }
        .summary-bar .item .value { font-size: 15px; font-weight: 700; color: #64ffda; }
        .summary-bar .item .value.total { font-size: 17px; color: #ffd700; }
        
        .nominal-input-group { display: none; margin: 8px 0; }
        .nominal-input-group.show { display: block; }
        .nominal-input-group .form-control { border-color: rgba(255,107,107,0.2); }
        .nominal-input-group .form-control:focus { border-color: #ff6b6b; }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-bayar { background: linear-gradient(135deg, #64ffda, #00b894); color: #0a1628; }
        .btn-bayar:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(100,255,218,0.2); }
        .btn-ambil { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff; }
        .btn-ambil:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,107,107,0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .result-card {
            background: rgba(100,255,218,0.04);
            border: 1px solid rgba(100,255,218,0.08);
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            display: none;
        }
        .result-card.show { display: block; }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .label { color: #8892b0; }
        .result-item .value { color: #e6f1ff; font-weight: 500; }
        .result-item .value.highlight-bayar { color: #64ffda; font-weight: 700; }
        .result-item .value.highlight-ambil { color: #ff6b6b; font-weight: 700; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: 8px;
            background: rgba(10,22,40,0.95);
            border: 1px solid rgba(100,255,218,0.15);
            color: #e6f1ff;
            font-size: 12px;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .toast.error { border-color: rgba(255,107,107,0.3); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #0a1628;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .saldo-ringkas {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
            margin: 6px 0;
        }
        .saldo-ringkas .item {
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
            padding: 6px 8px;
            text-align: center;
        }
        .saldo-ringkas .item .label { font-size: 8px; color: #8892b0; }
        .saldo-ringkas .item .value { font-size: 12px; font-weight: 600; color: #64ffda; }
        .saldo-ringkas .item .value.gold { color: #ffd700; }
        .saldo-ringkas .item .value.blue { color: #64b5f6; }
        
        .footer-info { text-align: center; font-size: 10px; color: #495670; padding: 6px 0; }
        
        @media (max-width: 480px) {
            .calendar-grid { grid-template-columns: repeat(4, 1fr); gap: 3px; }
            .date-checkbox { padding: 3px 4px; font-size: 10px; }
            .date-checkbox input[type="checkbox"] { width: 12px; height: 12px; }
            .saldo-ringkas { grid-template-columns: 1fr 1fr; }
            .summary-bar { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 380px) {
            .calendar-grid { grid-template-columns: repeat(3, 1fr); }
            .header h1 { font-size: 17px; }
            .card { padding: 12px; }
        }
        @media (min-width: 768px) {
            body { padding: 32px; }
            .container { max-width: 420px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="logo">🏦</span>
                Jimpitan Digital
            </h1>
        </div>

        <div class="card" id="saldoCard" style="display:none;">
            <div class="saldo-ringkas">
                <div class="item">
                    <div class="label">Saldo</div>
                    <div class="value" id="saldoGlobal">Rp 0</div>
                </div>
                <div class="item">
                    <div class="label">Peserta</div>
                    <div class="value" id="totalPeserta">0</div>
                </div>
                <div class="item">
                    <div class="label">Aktif</div>
                    <div class="value blue" id="pesertaAktif">0</div>
                </div>
                <div class="item">
                    <div class="label">Kredit</div>
                    <div class="value gold" id="totalKredit">Rp 0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <select class="form-control" id="pesertaSelect">
                    <option value="">-- Pilih Peserta --</option>
                </select>
            </div>

            <div class="form-group">
                <div class="jenis-toggle">
                    <button class="jenis-btn active bayar" id="btnBayar" onclick="setJenis('BAYAR')">
                        <span class="icon">📥</span> BAYAR
                    </button>
                    <button class="jenis-btn ambil" id="btnAmbil" onclick="setJenis('AMBIL')">
                        <span class="icon">📤</span> AMBIL
                    </button>
                </div>
            </div>

            <div class="form-group">
                <div class="month-nav">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                    <span class="month-label" id="monthLabel">Agustus 2026</span>
                    <button class="nav-btn" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>

            <div class="nominal-input-group" id="nominalInputGroup">
                <input type="text" class="form-control" id="nominalAmbil" placeholder="Nominal Ambil" oninput="formatNominal(this)">
            </div>

            <div class="summary-bar">
                <div class="item">
                    <div class="label">Hari</div>
                    <div class="value" id="selectedDays">0</div>
                </div>
                <div class="item">
                    <div class="label">Total</div>
                    <div class="value total" id="totalBayar">Rp 0</div>
                </div>
            </div>

            <button class="btn btn-bayar" id="prosesBtn" onclick="prosesTransaksi()">
                📤 PROSES
            </button>

            <div id="resultCard" class="result-card">
                <div id="resultContent"></div>
            </div>
        </div>

        <div class="footer-info">💡 Centang tanggal • Otomatis tercentang di sheet</div>
    </div>

    <div id="toastContainer"></div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzDQH4YbysPALwFnfl7aj7_g03ooZTf6sjwjKHPFmxnGlHjIoPKRvbDfDm-mPrsBuUh-g/exec';
        const API_TOKEN = 'JIMPITAN_DIGITAL_2024_SECRET_KEY';
        
        let pesertaList = [];
        let isProcessing = false;
        let jenisTransaksi = 'BAYAR';
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selectedDates = [];
        let pesertaSudahBayarHariIni = [];

        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            document.getElementById('pesertaSelect').addEventListener('change', function() {
                renderCalendar();
                updateInfo();
            });
            document.getElementById('nominalAmbil').addEventListener('input', updateInfo);
            renderCalendar();
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('✅ SW registered'))
                    .catch(err => console.log('❌ SW failed:', err));
            }
        });

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 
                               'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            document.getElementById('monthLabel').textContent = monthNames[currentMonth] + ' ' + currentYear;
            
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            const namaPeserta = document.getElementById('pesertaSelect').value;
            const peserta = pesertaList.find(p => p.nama === namaPeserta);
            const kalenderPeserta = peserta ? peserta.kalender || {} : {};
            
            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                empty.style.visibility = 'hidden';
                grid.appendChild(empty);
            }
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(currentYear, currentMonth, day);
                const dateStr = formatDateInput(dateObj);
                const displayDate = String(day).padStart(2, '0') + '-' + 
                                   String(currentMonth + 1).padStart(2, '0') + '-' + 
                                   currentYear;
                
                const isPaid = kalenderPeserta[day] === true;
                const isChecked = selectedDates.includes(dateStr) && !isPaid;
                
                const div = document.createElement('div');
                div.className = 'date-checkbox';
                if (isChecked) div.classList.add('checked');
                if (isPaid) div.classList.add('paid');
                
                const dayName = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'][dateObj.getDay()];
                const badgeHtml = isPaid ? `<span class="badge-paid">✓</span>` : '';
                
                div.innerHTML = `
                    <input type="checkbox" ${isChecked ? 'checked' : ''} ${isPaid ? 'disabled' : ''} onchange="toggleDate('${dateStr}', this, ${isPaid})">
                    <span class="date-label">${displayDate}</span>
                    <span class="date-day">${dayName}</span>
                    ${badgeHtml}
                `;
                grid.appendChild(div);
            }
            updateSummary();
        }

        function toggleDate(dateStr, checkbox, isPaid) {
            if (isPaid) { checkbox.checked = false; showToast('⚠️ Sudah dibayar', true); return; }
            if (checkbox.checked) { if (!selectedDates.includes(dateStr)) selectedDates.push(dateStr); } 
            else { selectedDates = selectedDates.filter(d => d !== dateStr); }
            const parent = checkbox.closest('.date-checkbox');
            if (checkbox.checked) parent.classList.add('checked'); else parent.classList.remove('checked');
            updateSummary(); updateInfo();
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; } 
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function updateSummary() {
            const hariCount = selectedDates.length;
            document.getElementById('selectedDays').textContent = hariCount;
            const nama = document.getElementById('pesertaSelect').value;
            const peserta = pesertaList.find(p => p.nama === nama);
            let nominal = 0, total = 0;
            if (jenisTransaksi === 'BAYAR') {
                nominal = peserta ? peserta.iuran_harian : 0;
                total = hariCount * nominal;
            } else {
                nominal = parseInt(document.getElementById('nominalAmbil').value.replace(/[^\d]/g, '')) || 0;
                total = nominal;
            }
            document.getElementById('totalBayar').textContent = formatRupiah(total);
        }

        function setJenis(jenis) {
            jenisTransaksi = jenis;
            document.getElementById('btnBayar').className = 'jenis-btn' + (jenis === 'BAYAR' ? ' active bayar' : '');
            document.getElementById('btnAmbil').className = 'jenis-btn' + (jenis === 'AMBIL' ? ' active ambil' : '');
            const nominalGroup = document.getElementById('nominalInputGroup');
            if (jenis === 'AMBIL') {
                nominalGroup.classList.add('show');
            } else {
                nominalGroup.classList.remove('show');
                document.getElementById('nominalAmbil').value = '';
            }
            const btn = document.getElementById('prosesBtn');
            btn.className = 'btn ' + (jenis === 'BAYAR' ? 'btn-bayar' : 'btn-ambil');
            btn.innerHTML = (jenis === 'BAYAR' ? '📤' : '📥') + ' PROSES';
            updateInfo();
        }

        function formatNominal(input) {
            let value = input.value.replace(/[^\d]/g, '');
            if (value) input.value = new Intl.NumberFormat('id-ID').format(parseInt(value));
            updateInfo();
        }

        function getNominalValue() {
            if (jenisTransaksi === 'BAYAR') {
                const nama = document.getElementById('pesertaSelect').value;
                const peserta = pesertaList.find(p => p.nama === nama);
                return peserta ? peserta.iuran_harian : 0;
            } else {
                return parseInt(document.getElementById('nominalAmbil').value.replace(/[^\d]/g, '')) || 0;
            }
        }

        async function loadData() {
            try {
                showToast('🔄 Memuat...');
                const res1 = await fetch(`${API_URL}?action=getPeserta`);
                const data1 = await res1.json();
                if (data1.status === 'success') {
                    pesertaList = data1.data || [];
                    const today = new Date();
                    const todayStr = formatDateInput(today);
                    pesertaSudahBayarHariIni = await getPesertaSudahBayar(todayStr);
                    const pesertaBelumBayar = pesertaList.filter(p => !pesertaSudahBayarHariIni.some(b => b.nama === p.nama));
                    const select = document.getElementById('pesertaSelect');
                    select.innerHTML = '<option value="">-- Pilih Peserta --</option>';
                    pesertaBelumBayar.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.nama;
                        opt.textContent = `${p.nama} (${formatRupiah(p.iuran_harian || 0)})`;
                        select.appendChild(opt);
                    });
                    if (pesertaSudahBayarHariIni.length > 0) {
                        const optGroup = document.createElement('optgroup');
                        optGroup.label = `✅ Sudah (${pesertaSudahBayarHariIni.length})`;
                        select.appendChild(optGroup);
                        pesertaSudahBayarHariIni.forEach(p => {
                            const opt = document.createElement('option');
                            opt.value = p.nama;
                            opt.textContent = `✅ ${p.nama}`;
                            opt.disabled = true;
                            optGroup.appendChild(opt);
                        });
                    }
                }
                const res2 = await fetch(`${API_URL}?action=getSummary`);
                const data2 = await res2.json();
                if (data2.status === 'success') {
                    document.getElementById('saldoCard').style.display = 'block';
                    document.getElementById('saldoGlobal').textContent = formatRupiah(data2.data?.saldo_global || 0);
                    document.getElementById('totalPeserta').textContent = pesertaList.length || 0;
                    document.getElementById('pesertaAktif').textContent = pesertaList.length - pesertaSudahBayarHariIni.length || 0;
                    document.getElementById('totalKredit').textContent = formatRupiah(data2.data?.total_kredit || 0);
                }
                renderCalendar();
                updateInfo();
            } catch (error) { showToast('❌ Gagal', true); }
        }

        async function getPesertaSudahBayar(tanggal) {
            try {
                const sudahBayar = [];
                for (const p of pesertaList) {
                    const res = await fetch(`${API_URL}?action=getRiwayat&nama=${encodeURIComponent(p.nama)}&limit=5`);
                    const data = await res.json();
                    if (data.status === 'success') {
                        const adaBayarHariIni = data.data.some(t => t.jenis === 'BAYAR' && t.tanggal === tanggal);
                        if (adaBayarHariIni) sudahBayar.push(p);
                    }
                }
                return sudahBayar;
            } catch { return []; }
        }

        function updateInfo() {
            const nama = document.getElementById('pesertaSelect').value;
            const hariCount = selectedDates.length;
            const nominal = getNominalValue();
            const total = jenisTransaksi === 'BAYAR' ? hariCount * nominal : nominal;
            const btn = document.getElementById('prosesBtn');
            if (!nama || hariCount === 0 || nominal <= 0) {
                btn.disabled = true;
                btn.textContent = (jenisTransaksi === 'BAYAR' ? '📤' : '📥') + ' PROSES';
                return;
            }
            btn.disabled = false;
            btn.textContent = (jenisTransaksi === 'BAYAR' ? '📤' : '📥') + ' PROSES ' + formatRupiah(total);
        }

        async function prosesTransaksi() {
            if (isProcessing) return;
            const nama = document.getElementById('pesertaSelect').value;
            const nominal = getNominalValue();
            const hariCount = selectedDates.length;
            const total = jenisTransaksi === 'BAYAR' ? hariCount * nominal : nominal;
            if (!nama) { showToast('❌ Pilih peserta', true); return; }
            if (hariCount === 0) { showToast('❌ Pilih tanggal', true); return; }
            if (nominal <= 0) { showToast('❌ Masukkan nominal', true); return; }
            const sortedDates = selectedDates.sort();
            const tanggalMulai = sortedDates[0];
            const tanggalAkhir = sortedDates[sortedDates.length - 1];
            const jenisLabel = jenisTransaksi === 'BAYAR' ? 'BAYAR' : 'AMBIL';
            let confirmMsg = jenisTransaksi === 'BAYAR' ?
                `Konfirmasi ${jenisLabel}\n${nama}\n${formatTanggal(tanggalMulai)} s.d. ${formatTanggal(tanggalAkhir)}\n${hariCount} hari × ${formatRupiah(nominal)} = ${formatRupiah(total)}` :
                `Konfirmasi ${jenisLabel}\n${nama}\n${formatTanggal(tanggalMulai)}\n${formatRupiah(nominal)}`;
            if (!confirm(confirmMsg)) return;
            isProcessing = true;
            const btn = document.getElementById('prosesBtn');
            btn.innerHTML = '<span class="spinner"></span> Memproses...';
            btn.disabled = true;
            try {
                const action = jenisTransaksi === 'BAYAR' ? 'bayar' : 'ambil';
                const formData = new URLSearchParams();
                formData.append('action', action);
                formData.append('token', API_TOKEN);
                formData.append('nama', nama);
                formData.append('tanggal', tanggalMulai);
                formData.append('nominal', nominal);
                formData.append('hari', hariCount);
                formData.append('tanggal_akhir', tanggalAkhir);
                formData.append('keterangan', `${jenisLabel} ${hariCount} hari (${formatTanggal(tanggalMulai)} - ${formatTanggal(tanggalAkhir)})`);
                const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: formData });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast(`✅ ${data.message}`);
                    const resultCard = document.getElementById('resultCard');
                    resultCard.classList.add('show');
                    const highlightClass = jenisTransaksi === 'BAYAR' ? 'highlight-bayar' : 'highlight-ambil';
                    let kreditHtml = '';
                    if (data.data.kredit) {
                        kreditHtml = `
                            <div class="result-item"><span class="label">Kredit</span><span class="value highlight-bayar">${formatRupiah(data.data.kredit.kredit)}</span></div>
                            <div class="result-item"><span class="label">Hari</span><span class="value">${data.data.kredit.hari_terbayar} hari</span></div>
                            <div class="result-item"><span class="label">Sampai</span><span class="value">${data.data.kredit.tanggal_akhir}</span></div>
                            <div class="result-item"><span class="label">Iuran</span><span class="value">${formatRupiah(data.data.kredit.iuran_harian)}</span></div>
                            <div class="result-item"><span class="label">Bulan</span><span class="value">${data.data.bulan || '-'}</span></div>
                        `;
                    }
                    document.getElementById('resultContent').innerHTML = `
                        <div style="text-align:center;margin-bottom:8px;color:#64ffda;font-weight:600;">✅ Berhasil</div>
                        <div class="result-item"><span class="label">ID</span><span class="value">${data.data.id}</span></div>
                        <div class="result-item"><span class="label">Peserta</span><span class="value">${data.data.nama}</span></div>
                        <div class="result-item"><span class="label">Jenis</span><span class="value ${highlightClass}">${data.data.jenis}</span></div>
                        <div class="result-item"><span class="label">Tanggal</span><span class="value">${formatTanggal(data.data.tanggal)}</span></div>
                        ${data.data.tanggal_akhir ? `<div class="result-item"><span class="label">Sampai</span><span class="value">${formatTanggal(data.data.tanggal_akhir)}</span></div>` : ''}
                        <div class="result-item"><span class="label">Hari</span><span class="value">${data.data.hari} hari</span></div>
                        <div class="result-item"><span class="label">Nominal</span><span class="value ${highlightClass}">${formatRupiah(data.data.nominal)}</span></div>
                        ${data.data.total_nominal ? `<div class="result-item"><span class="label">Total</span><span class="value ${highlightClass}">${formatRupiah(data.data.total_nominal)}</span></div>` : ''}
                        ${kreditHtml}
                    `;
                    document.getElementById('prosesBtn').disabled = true;
                    selectedDates = [];
                    renderCalendar();
                    updateSummary();
                    loadData();
                } else { throw new Error(data.message || 'Gagal'); }
            } catch (error) { showToast(`❌ ${error.message}`, true); }
            isProcessing = false;
            btn.innerHTML = (jenisTransaksi === 'BAYAR' ? '📤' : '📥') + ' PROSES';
            btn.disabled = false;
        }

        function formatDateInput(date) {
            if (!date || isNaN(date.getTime())) date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatTanggal(tanggalStr) {
            try {
                const parts = tanggalStr.split('-');
                if (parts.length === 3) {
                    if (parts[0].length === 4) return `${parts[2]}-${parts[1]}-${parts[0]}`;
                    return `${parts[0]}-${parts[1]}-${parts[2]}`;
                }
                const date = new Date(tanggalStr);
                if (!isNaN(date.getTime())) {
                    return `${String(date.getDate()).padStart(2,'0')}-${String(date.getMonth()+1).padStart(2,'0')}-${date.getFullYear()}`;
                }
                return tanggalStr;
            } catch { return tanggalStr; }
        }

        function formatRupiah(num) { return 'Rp ' + (num || 0).toLocaleString('id-ID'); }

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(16px)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
</body>
</html>
