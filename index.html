<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jimpitan">
    <meta name="application-name" content="Jimpitan Digital">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a1628">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    
    <title>Jimpitan Digital</title>
    
    <style>
        /* ===== SAMA SEPERTI SEBELUMNYA ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1628;
            color: #e6f1ff;
            min-height: 100vh;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 480px; margin: 0 auto; }
        
        .header { text-align: center; padding: 16px 0 20px; }
        .header h1 { 
            font-size: 22px; 
            color: #64ffda;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header h1 .logo {
            display: inline-block;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #64ffda, #00b894);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #0a1628;
        }
        .header p { font-size: 13px; color: #8892b0; margin-top: 4px; }
        
        .card {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card-title { 
            font-size: 15px; 
            font-weight: 600; 
            color: #64ffda; 
            margin-bottom: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
        }
        
        .form-group { margin-bottom: 12px; }
        .form-label { 
            display: block; 
            font-size: 12px; 
            color: #8892b0; 
            margin-bottom: 4px; 
            font-weight: 500; 
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #e6f1ff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-control:focus { border-color: #64ffda; }
        .form-control option { background: #0a1628; }
        .form-control option:disabled { color: #495670; opacity: 0.6; }
        
        .jenis-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .jenis-btn {
            padding: 10px;
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            color: #8892b0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .jenis-btn .icon { display: block; font-size: 18px; margin-bottom: 2px; }
        .jenis-btn.active.bayar {
            border-color: #64ffda;
            background: rgba(100,255,218,0.1);
            color: #64ffda;
        }
        .jenis-btn.active.ambil {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.1);
            color: #ff6b6b;
        }
        
        .info-box {
            background: rgba(100,255,218,0.05);
            border: 1px solid rgba(100,255,218,0.1);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px 0;
            display: none;
        }
        .info-box .label { font-size: 11px; color: #8892b0; }
        .info-box .value { font-size: 20px; font-weight: 700; color: #64ffda; }
        .info-box .detail { font-size: 12px; color: #ccd6f6; margin-top: 2px; }
        
        .kredit-info {
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 8px;
            padding: 10px 14px;
            margin: 10px 0;
            display: none;
        }
        .kredit-info .label { font-size: 11px; color: #8892b0; }
        .kredit-info .value { font-size: 13px; font-weight: 600; color: #ffd700; }
        .kredit-info .value .highlight { color: #64ffda; }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-bayar {
            background: linear-gradient(135deg, #64ffda, #00b894);
            color: #0a1628;
        }
        .btn-bayar:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(100,255,218,0.2); }
        .btn-ambil {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
        }
        .btn-ambil:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,107,107,0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .result-card {
            background: rgba(100,255,218,0.04);
            border: 1px solid rgba(100,255,218,0.08);
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
            display: none;
        }
        .result-card.show { display: block; }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .label { color: #8892b0; }
        .result-item .value { color: #e6f1ff; font-weight: 500; }
        .result-item .value.highlight-bayar { color: #64ffda; font-weight: 700; }
        .result-item .value.highlight-ambil { color: #ff6b6b; font-weight: 700; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 8px;
            background: rgba(10,22,40,0.95);
            border: 1px solid rgba(100,255,218,0.15);
            color: #e6f1ff;
            font-size: 13px;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .toast.error { border-color: rgba(255,107,107,0.3); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #0a1628;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(100,255,218,0.12);
            color: #64ffda;
        }
        .saldo-ringkas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        .saldo-ringkas .item {
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 8px 12px;
            text-align: center;
        }
        .saldo-ringkas .item .label { font-size: 10px; color: #8892b0; }
        .saldo-ringkas .item .value { font-size: 16px; font-weight: 600; color: #64ffda; }
        .saldo-ringkas .item .value.gold { color: #ffd700; }
        .saldo-ringkas .item .value.blue { color: #64b5f6; }
        
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 10px;
        }
        .btn-group .btn {
            font-size: 11px;
            padding: 8px 4px;
        }
        .btn-group .btn-small {
            background: rgba(255,255,255,0.06);
            color: #ccd6f6;
        }
        .btn-group .btn-small:hover {
            background: rgba(255,255,255,0.12);
        }
        
        .footer-info {
            text-align: center;
            font-size: 11px;
            color: #495670;
            padding: 10px 0;
        }
        .footer-info .version {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            font-size: 10px;
            color: #495670;
            margin-top: 4px;
        }
        
        /* ===== BADGE UNTUK PESERTA SUDAH BAYAR ===== */
        .badge-done {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            background: rgba(100,255,218,0.12);
            color: #64ffda;
            margin-left: 6px;
        }
        
        @media (max-width: 480px) {
            .saldo-ringkas { grid-template-columns: 1fr 1fr; }
            .saldo-ringkas .item { padding: 6px 8px; }
            .saldo-ringkas .item .value { font-size: 14px; }
        }
        @media (max-width: 380px) {
            .btn-group { grid-template-columns: 1fr 1fr; }
            .header h1 { font-size: 18px; }
            .card { padding: 14px; }
        }
        @media (min-width: 768px) {
            body { padding: 32px; }
            .container { max-width: 420px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="logo">🏦</span>
                Jimpitan Digital
            </h1>
            <p>Sistem Iuran Harian dengan Kredit Otomatis</p>
        </div>

        <div class="card" id="saldoCard" style="display:none;">
            <div class="saldo-ringkas">
                <div class="item">
                    <div class="label">Saldo Global</div>
                    <div class="value" id="saldoGlobal">Rp 0</div>
                </div>
                <div class="item">
                    <div class="label">Total Peserta</div>
                    <div class="value" id="totalPeserta">0</div>
                </div>
                <div class="item">
                    <div class="label">Perlu Bayar</div>
                    <div class="value blue" id="pesertaAktif">0</div>
                </div>
                <div class="item">
                    <div class="label">Total Kredit</div>
                    <div class="value gold" id="totalKredit">Rp 0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                📝 Transaksi
                <span class="status-badge" id="statusBadge">SIAP</span>
            </div>

            <div class="form-group">
                <label class="form-label">👤 Peserta</label>
                <select class="form-control" id="pesertaSelect">
                    <option value="">-- Pilih Peserta --</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">📊 Jenis</label>
                <div class="jenis-toggle">
                    <button class="jenis-btn active bayar" id="btnBayar" onclick="setJenis('BAYAR')">
                        <span class="icon">📥</span> BAYAR
                    </button>
                    <button class="jenis-btn ambil" id="btnAmbil" onclick="setJenis('AMBIL')">
                        <span class="icon">📤</span> AMBIL
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">📅 Tanggal</label>
                <input type="date" class="form-control" id="tanggalTransaksi">
            </div>

            <div class="form-group">
                <label class="form-label" id="nominalLabel">💰 Nominal (BAYAR)</label>
                <input type="text" class="form-control" id="nominalInput" placeholder="Contoh: 100.000" oninput="formatNominal(this)">
            </div>

            <div class="form-group">
                <label class="form-label">📝 Keterangan (opsional)</label>
                <input type="text" class="form-control" id="keteranganInput" placeholder="Contoh: Iuran Agustus 2026">
            </div>

            <div id="infoBox" class="info-box">
                <div class="label">💡 Ringkasan</div>
                <div class="value" id="totalInfo">Rp 0</div>
                <div class="detail" id="detailInfo">-</div>
            </div>

            <div id="kreditInfo" class="kredit-info">
                <div class="label">📊 Status Kredit</div>
                <div class="value" id="kreditDetail">-</div>
            </div>

            <button class="btn btn-bayar" id="prosesBtn" onclick="prosesTransaksi()">
                📤 PROSES
            </button>

            <div class="btn-group">
                <button onclick="refreshData()" class="btn btn-small">
                    🔄 Refresh
                </button>
                <button onclick="setupTrigger()" class="btn btn-small" style="background:rgba(255,215,0,0.1);color:#ffd700;">
                    ⏰ Auto-Debit
                </button>
                <button onclick="runAutoDebit()" class="btn btn-small" style="background:rgba(100,255,218,0.05);color:#64ffda;">
                    ⚡ Jalankan
                </button>
            </div>

            <div id="resultCard" class="result-card">
                <div id="resultContent"></div>
            </div>
        </div>

        <div class="footer-info">
            <p>💡 Sistem Bayar Mendahului (Kredit) • Auto-Debit Setiap Hari</p>
            <span class="version">Versi 2.0.1</span>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // ============================================
        // KONFIGURASI
        // ============================================
        const API_URL = 'https://script.google.com/macros/s/AKfycbzfJDn38ZsxjPMajznIHIFPiOYiieDo9SOh-u9xvCvxMeosVvy2td7aKPxq1mqc7mZ5/exec';
        const API_TOKEN = 'JIMPITAN_DIGITAL_2024_SECRET_KEY';
        
        let pesertaList = [];
        let isProcessing = false;
        let jenisTransaksi = 'BAYAR';
        let pesertaSudahBayarHariIni = [];

        // ============================================
        // INISIALISASI
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Set tanggal default
            setDefaultDate();
            
            // Validasi tanggal
            const dateInput = document.getElementById('tanggalTransaksi');
            dateInput.addEventListener('change', function() {
                validateDate(this);
            });
            
            // Load data
            loadData();
            
            // Event listeners
            document.getElementById('pesertaSelect').addEventListener('change', function() {
                updateInfo();
                loadKreditStatus(this.value);
            });
            document.getElementById('nominalInput').addEventListener('input', updateInfo);
            
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('✅ SW registered'))
                    .catch(err => console.log('❌ SW failed:', err));
            }
        });

        // ============================================
        // FUNGSI TANGGAL
        // ============================================
        function setDefaultDate() {
            const today = new Date();
            const dateInput = document.getElementById('tanggalTransaksi');
            dateInput.value = formatDateInput(today);
            console.log('📅 Tanggal default:', dateInput.value);
        }

        function validateDate(input) {
            if (!input.value) {
                setDefaultDate();
                showToast('⚠️ Tanggal diisi otomatis dengan hari ini');
                return;
            }
            
            const parts = input.value.split('-');
            if (parts.length === 3) {
                const year = parseInt(parts[0]);
                if (year < 2000 || year > 2100) {
                    setDefaultDate();
                    showToast('⚠️ Tahun tidak valid, direset ke hari ini');
                }
            }
        }

        function formatDateInput(date) {
            if (!date || isNaN(date.getTime())) date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatTanggal(tanggalStr) {
            try {
                const parts = tanggalStr.split('-');
                if (parts.length === 3) {
                    return `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
                const date = new Date(tanggalStr);
                return date.toLocaleDateString('id-ID', { 
                    day: '2-digit', 
                    month: 'long', 
                    year: 'numeric' 
                });
            } catch { 
                return tanggalStr; 
            }
        }

        // ============================================
        // FUNGSI JENIS TRANSAKSI
        // ============================================
        function setJenis(jenis) {
            jenisTransaksi = jenis;
            
            document.getElementById('btnBayar').className = 'jenis-btn' + (jenis === 'BAYAR' ? ' active bayar' : '');
            document.getElementById('btnAmbil').className = 'jenis-btn' + (jenis === 'AMBIL' ? ' active ambil' : '');
            
            const label = document.getElementById('nominalLabel');
            if (jenis === 'BAYAR') {
                label.innerHTML = '💰 Nominal (BAYAR)';
                label.style.color = '#64ffda';
            } else {
                label.innerHTML = '💰 Nominal (AMBIL)';
                label.style.color = '#ff6b6b';
            }
            
            const btn = document.getElementById('prosesBtn');
            btn.className = 'btn ' + (jenis === 'BAYAR' ? 'btn-bayar' : 'btn-ambil');
            btn.innerHTML = (jenis === 'BAYAR' ? '📤' : '📥') + ' PROSES';
            
            updateInfo();
        }

        // ============================================
        // FORMAT NOMINAL
        // ============================================
        function formatNominal(input) {
            let value = input.value.replace(/[^\d]/g, '');
            if (value) {
                input.value = new Intl.NumberFormat('id-ID').format(parseInt(value));
            }
            updateInfo();
        }

        function getNominalValue() {
            const input = document.getElementById('nominalInput');
            return parseInt(input.value.replace(/[^\d]/g, '')) || 0;
        }

        // ============================================
        // LOAD DATA DENGAN AUTO-HIDE
        // ============================================
        async function loadData() {
            try {
                showToast('🔄 Memuat data...');
                
                // 1. Load peserta
                const res1 = await fetch(`${API_URL}?action=getPeserta`);
                const data1 = await res1.json();
                
                if (data1.status === 'success') {
                    pesertaList = data1.data || [];
                    
                    // 2. Cek peserta yang sudah bayar hari ini
                    const today = new Date();
                    const todayStr = formatDateInput(today);
                    
                    // Ambil daftar peserta yang sudah bayar hari ini
                    pesertaSudahBayarHariIni = await getPesertaSudahBayar(todayStr);
                    
                    // 3. Filter peserta yang BELUM bayar
                    const pesertaBelumBayar = pesertaList.filter(p => {
                        return !pesertaSudahBayarHariIni.some(b => b.nama === p.nama);
                    });
                    
                    // 4. Tampilkan di dropdown
                    const select = document.getElementById('pesertaSelect');
                    select.innerHTML = '<option value="">-- Pilih Peserta --</option>';
                    
                    // Peserta yang belum bayar (aktif)
                    pesertaBelumBayar.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.nama;
                        opt.textContent = `${p.nama} (Iuran: ${formatRupiah(p.iuran_harian || 0)}/hari)`;
                        select.appendChild(opt);
                    });
                    
                    // Peserta yang sudah bayar (disabled - hanya info)
                    if (pesertaSudahBayarHariIni.length > 0) {
                        const optGroup = document.createElement('optgroup');
                        optGroup.label = `✅ Sudah Bayar Hari Ini (${pesertaSudahBayarHariIni.length})`;
                        select.appendChild(optGroup);
                        
                        pesertaSudahBayarHariIni.forEach(p => {
                            const opt = document.createElement('option');
                            opt.value = p.nama;
                            opt.textContent = `✅ ${p.nama} (${formatRupiah(p.iuran_harian || 0)})`;
                            opt.disabled = true;
                            optGroup.appendChild(opt);
                        });
                    }
                }
                
                // 5. Load summary
                const res2 = await fetch(`${API_URL}?action=getSummary`);
                const data2 = await res2.json();
                
                if (data2.status === 'success') {
                    document.getElementById('saldoCard').style.display = 'block';
                    document.getElementById('saldoGlobal').textContent = formatRupiah(data2.data?.saldo_global || 0);
                    document.getElementById('totalPeserta').textContent = pesertaList.length || 0;
                    document.getElementById('pesertaAktif').textContent = pesertaList.length - pesertaSudahBayarHariIni.length || 0;
                    document.getElementById('totalKredit').textContent = formatRupiah(data2.data?.total_kredit || 0);
                }
                
                const aktif = pesertaList.length - pesertaSudahBayarHariIni.length;
                showToast(`✅ ${aktif} peserta aktif, ${pesertaSudahBayarHariIni.length} sudah bayar`);
                updateInfo();
            } catch (error) {
                console.error('Error:', error);
                showToast('❌ Gagal memuat data', true);
            }
        }

        // ============================================
        // FUNGSI CEK PESERTA SUDAH BAYAR
        // ============================================
        async function getPesertaSudahBayar(tanggal) {
            try {
                const sudahBayar = [];
                
                for (const p of pesertaList) {
                    const res = await fetch(`${API_URL}?action=getRiwayat&nama=${encodeURIComponent(p.nama)}&limit=5`);
                    const data = await res.json();
                    
                    if (data.status === 'success') {
                        const adaBayarHariIni = data.data.some(t => {
                            return t.jenis === 'BAYAR' && t.tanggal === tanggal;
                        });
                        
                        if (adaBayarHariIni) {
                            sudahBayar.push(p);
                        }
                    }
                }
                
                return sudahBayar;
            } catch (error) {
                console.error('Error cek pembayaran:', error);
                return [];
            }
        }

        // ============================================
        // REFRESH & AUTO-DEBIT
        // ============================================
        async function refreshData() {
            await loadData();
            const nama = document.getElementById('pesertaSelect').value;
            if (nama) loadKreditStatus(nama);
            showToast('✅ Data diperbarui');
        }

        async function setupTrigger() {
            try {
                showToast('🔄 Setup trigger...');
                const res = await fetch(`${API_URL}?action=setupTrigger`);
                const data = await res.json();
                if (data.status === 'success') {
                    showToast('✅ Trigger auto-debit berhasil dibuat!');
                } else {
                    showToast('❌ ' + data.message, true);
                }
            } catch (error) {
                showToast('❌ Gagal setup trigger', true);
            }
        }

        async function runAutoDebit() {
            try {
                showToast('🔄 Menjalankan auto-debit...');
                const res = await fetch(`${API_URL}?action=autoDebitKredit`);
                const data = await res.json();
                if (data.status === 'success') {
                    showToast(`✅ Auto-debit selesai! ${data.updated || 0} peserta diupdate`);
                    loadData();
                } else {
                    showToast('❌ ' + data.message, true);
                }
            } catch (error) {
                showToast('❌ Gagal menjalankan auto-debit', true);
            }
        }

        // ============================================
        // LOAD KREDIT STATUS
        // ============================================
        async function loadKreditStatus(nama) {
            const kreditInfo = document.getElementById('kreditInfo');
            if (!nama) {
                kreditInfo.style.display = 'none';
                return;
            }
            
            try {
                const res = await fetch(`${API_URL}?action=getKreditStatus&nama=${encodeURIComponent(nama)}`);
                const data = await res.json();
                
                if (data.status === 'success' && data.data) {
                    const kredit = data.data;
                    if (kredit.kredit > 0) {
                        kreditInfo.style.display = 'block';
                        document.getElementById('kreditDetail').innerHTML = 
                            `💳 Kredit: <span class="highlight">${kredit.kredit_formatted}</span> | ` +
                            `Berlaku sampai: <span class="highlight">${kredit.tanggal_akhir}</span> | ` +
                            `Status: <span style="color:${kredit.status === 'AKTIF' ? '#64ffda' : '#ff6b6b'};">${kredit.status}</span>`;
                    } else {
                        kreditInfo.style.display = 'none';
                    }
                } else {
                    kreditInfo.style.display = 'none';
                }
            } catch (error) {
                kreditInfo.style.display = 'none';
            }
        }

        // ============================================
        // UPDATE INFO
        // ============================================
        function updateInfo() {
            const nama = document.getElementById('pesertaSelect').value;
            const nominal = getNominalValue();
            const tanggal = document.getElementById('tanggalTransaksi').value;
            const infoBox = document.getElementById('infoBox');
            const btn = document.getElementById('prosesBtn');
            
            if (!nama || !tanggal || nominal <= 0) {
                infoBox.style.display = 'none';
                btn.disabled = true;
                btn.textContent = (jenisTransaksi === 'BAYAR' ? '📤' : '📥') + ' PROSES';
                return;
            }
            
            const jenis = jenisTransaksi === 'BAYAR' ? 'Bayar' : 'Ambil';
            const highlightClass = jenisTransaksi === 'BAYAR' ? 'highlight-bayar' : 'highlight-ambil';
            
            infoBox.style.display = 'block';
            document.getElementById('totalInfo').textContent = formatRupiah(nominal);
            document.getElementById('detailInfo').innerHTML = 
                `${jenis} <span class="${highlightClass}">${formatRupiah(nominal)}</span> oleh ${nama}` +
                `<br><span style="font-size:11px;color:#8892b0;">Tanggal: ${formatTanggal(tanggal)}</span>`;
            
            btn.disabled = false;
            btn.textContent = (jenisTransaksi === 'BAYAR' ? '📤' : '📥') + ' PROSES';
        }

        // ============================================
        // PROSES TRANSAKSI - DENGAN PERBAIKAN TANGGAL
        // ============================================
        async function prosesTransaksi() {
            if (isProcessing) return;
            
            const nama = document.getElementById('pesertaSelect').value;
            const tanggalInput = document.getElementById('tanggalTransaksi');
            
            // ===== PASTIKAN TANGGAL TERISI =====
            let tanggal = tanggalInput.value;
            
            if (!tanggal || tanggal === '') {
                const today = new Date();
                const y = today.getFullYear();
                const m = String(today.getMonth() + 1).padStart(2, '0');
                const d = String(today.getDate()).padStart(2, '0');
                tanggal = `${y}-${m}-${d}`;
                tanggalInput.value = tanggal;
                showToast('📅 Tanggal diisi otomatis: ' + formatTanggal(tanggal));
            }
            
            // Validasi tahun
            const parts = tanggal.split('-');
            if (parts.length === 3) {
                const year = parseInt(parts[0]);
                if (year < 2000 || year > 2100) {
                    const today = new Date();
                    const y = today.getFullYear();
                    const m = String(today.getMonth() + 1).padStart(2, '0');
                    const d = String(today.getDate()).padStart(2, '0');
                    tanggal = `${y}-${m}-${d}`;
                    tanggalInput.value = tanggal;
                    showToast('⚠️ Tahun tidak valid, direset ke: ' + formatTanggal(tanggal));
                }
            }
            
            console.log('📅 Tanggal dikirim:', tanggal);
            
            const nominal = getNominalValue();
            const keterangan = document.getElementById('keteranganInput').value.trim();
            
            if (!nama) { showToast('❌ Pilih peserta', true); return; }
            if (nominal <= 0) { showToast('❌ Masukkan nominal', true); return; }
            
            const jenisLabel = jenisTransaksi === 'BAYAR' ? 'BAYAR' : 'AMBIL';
            const confirmMsg = `Konfirmasi ${jenisLabel}\n\n` +
                              `Peserta: ${nama}\n` +
                              `Tanggal: ${formatTanggal(tanggal)}\n` +
                              `Nominal: ${formatRupiah(nominal)}\n\n` +
                              `Lanjutkan?`;
            
            if (!confirm(confirmMsg)) return;
            
            isProcessing = true;
            const btn = document.getElementById('prosesBtn');
            btn.innerHTML = '<span class="spinner"></span> Memproses...';
            btn.disabled = true;
            
            try {
                const action = jenisTransaksi === 'BAYAR' ? 'bayar' : 'ambil';
                
                const formData = new URLSearchParams();
                formData.append('action', action);
                formData.append('token', API_TOKEN);
                formData.append('nama', nama);
                formData.append('tanggal', tanggal);
                formData.append('nominal', nominal);
                formData.append('keterangan', keterangan || `${jenisLabel} ${formatTanggal(tanggal)}`);
                
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    showToast(`✅ ${data.message}`);
                    
                    const resultCard = document.getElementById('resultCard');
                    resultCard.classList.add('show');
                    
                    const highlightClass = jenisTransaksi === 'BAYAR' ? 'highlight-bayar' : 'highlight-ambil';
                    
                    let kreditHtml = '';
                    if (data.data.kredit) {
                        kreditHtml = `
                            <div class="result-item"><span class="label">Kredit</span><span class="value highlight-bayar">${formatRupiah(data.data.kredit.kredit)}</span></div>
                            <div class="result-item"><span class="label">Hari Terbayar</span><span class="value">${data.data.kredit.hari_terbayar} hari</span></div>
                            <div class="result-item"><span class="label">Berlaku Sampai</span><span class="value">${data.data.kredit.tanggal_akhir}</span></div>
                            <div class="result-item"><span class="label">Iuran Harian</span><span class="value">${formatRupiah(data.data.kredit.iuran_harian)}</span></div>
                        `;
                    }
                    
                    document.getElementById('resultContent').innerHTML = `
                        <div style="text-align:center;margin-bottom:10px;color:#64ffda;font-weight:600;">✅ Transaksi Berhasil</div>
                        <div class="result-item"><span class="label">ID</span><span class="value">${data.data.id}</span></div>
                        <div class="result-item"><span class="label">Peserta</span><span class="value">${data.data.nama}</span></div>
                        <div class="result-item"><span class="label">Jenis</span><span class="value ${highlightClass}">${data.data.jenis}</span></div>
                        <div class="result-item"><span class="label">Tanggal</span><span class="value">${data.data.tanggal}</span></div>
                        <div class="result-item"><span class="label">Nominal</span><span class="value ${highlightClass}">${data.data.nominal_formatted}</span></div>
                        ${kreditHtml}
                    `;
                    
                    document.getElementById('nominalInput').value = '';
                    document.getElementById('keteranganInput').value = '';
                    document.getElementById('infoBox').style.display = 'none';
                    document.getElementById('prosesBtn').disabled = true;
                    
                    // Refresh data dan hilangkan peserta dari dropdown
                    loadData();
                    loadKreditStatus(nama);
                } else {
                    throw new Error(data.message || 'Gagal menyimpan transaksi');
                }
            } catch (error) {
                showToast(`❌ ${error.message}`, true);
            }
            
            isProcessing = false;
            btn.innerHTML = (jenisTransaksi === 'BAYAR' ? '📤' : '📥') + ' PROSES';
            btn.disabled = false;
        }

        // ============================================
        // UTILITY
        // ============================================
        function formatRupiah(num) { 
            return 'Rp ' + (num || 0).toLocaleString('id-ID'); 
        }
        
        function formatNumber(num) { 
            return (num || 0).toLocaleString('id-ID'); 
        }

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.textContent = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(16px)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
</body>
</html>
