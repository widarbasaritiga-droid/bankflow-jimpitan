<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimpitan Digital</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a1628;
            color: #e6f1ff;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 480px; margin: 0 auto; }
        .header { text-align: center; padding: 16px 0 20px; }
        .header h1 { font-size: 22px; color: #64ffda; }
        .header p { font-size: 13px; color: #8892b0; }
        .card {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .card-title { font-size: 15px; font-weight: 600; color: #64ffda; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 12px; color: #8892b0; margin-bottom: 4px; font-weight: 500; }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #e6f1ff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-control:focus { border-color: #64ffda; }
        .form-control option { background: #0a1628; }
        
        .jenis-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .jenis-btn {
            padding: 10px;
            border: 2px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            color: #8892b0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .jenis-btn .icon { display: block; font-size: 18px; margin-bottom: 2px; }
        .jenis-btn.active.setor {
            border-color: #64ffda;
            background: rgba(100,255,218,0.1);
            color: #64ffda;
        }
        .jenis-btn.active.tarik {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.1);
            color: #ff6b6b;
        }
        
        .info-box {
            background: rgba(100,255,218,0.05);
            border: 1px solid rgba(100,255,218,0.1);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 12px 0;
            display: none;
        }
        .info-box .label { font-size: 11px; color: #8892b0; }
        .info-box .value { font-size: 20px; font-weight: 700; color: #64ffda; }
        .info-box .detail { font-size: 12px; color: #ccd6f6; margin-top: 2px; }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-setor {
            background: linear-gradient(135deg, #64ffda, #00b894);
            color: #0a1628;
        }
        .btn-setor:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(100,255,218,0.2); }
        .btn-tarik {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: #fff;
        }
        .btn-tarik:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,107,107,0.2); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .result-card {
            background: rgba(100,255,218,0.04);
            border: 1px solid rgba(100,255,218,0.08);
            border-radius: 8px;
            padding: 14px;
            margin-top: 12px;
            display: none;
        }
        .result-card.show { display: block; }
        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .result-item:last-child { border-bottom: none; }
        .result-item .label { color: #8892b0; }
        .result-item .value { color: #e6f1ff; font-weight: 500; }
        .result-item .value.highlight-setor { color: #64ffda; font-weight: 700; }
        .result-item .value.highlight-tarik { color: #ff6b6b; font-weight: 700; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 8px;
            background: rgba(10,22,40,0.95);
            border: 1px solid rgba(100,255,218,0.15);
            color: #e6f1ff;
            font-size: 13px;
            z-index: 1000;
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }
        .toast.error { border-color: rgba(255,107,107,0.3); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #0a1628;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(100,255,218,0.12);
            color: #64ffda;
        }
        .saldo-ringkas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        .saldo-ringkas .item {
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
            padding: 8px 12px;
            text-align: center;
        }
        .saldo-ringkas .item .label { font-size: 10px; color: #8892b0; }
        .saldo-ringkas .item .value { font-size: 16px; font-weight: 600; color: #64ffda; }
        @media (max-width: 480px) {
            .saldo-ringkas { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏦 Jimpitan Digital</h1>
            <p>Sistem Setoran & Penarikan</p>
        </div>

        <div class="card" id="saldoCard" style="display:none;">
            <div class="saldo-ringkas">
                <div class="item">
                    <div class="label">Saldo Global</div>
                    <div class="value" id="saldoGlobal">Rp 0</div>
                </div>
                <div class="item">
                    <div class="label">Total Nasabah</div>
                    <div class="value" id="totalNasabah">0</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                📝 Transaksi
                <span class="status-badge" id="statusBadge">SIAP</span>
            </div>

            <div class="form-group">
                <label class="form-label">👤 Nasabah</label>
                <select class="form-control" id="nasabahSelect">
                    <option value="">-- Pilih Nasabah --</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">📊 Jenis</label>
                <div class="jenis-toggle">
                    <button class="jenis-btn active setor" id="btnSetor" onclick="setJenis('SETOR')">
                        <span class="icon">📥</span> SETOR
                    </button>
                    <button class="jenis-btn tarik" id="btnTarik" onclick="setJenis('TARIK')">
                        <span class="icon">📤</span> TARIK
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">📅 Tanggal</label>
                <input type="date" class="form-control" id="tanggalTransaksi">
            </div>

            <div class="form-group">
                <label class="form-label" id="nominalLabel">💰 Nominal (SETOR)</label>
                <input type="text" class="form-control" id="nominalInput" placeholder="Contoh: 100.000" oninput="formatNominal(this)">
            </div>

            <div class="form-group">
                <label class="form-label">📝 Keterangan (opsional)</label>
                <input type="text" class="form-control" id="keteranganInput" placeholder="Contoh: Jimpitan Agustus 2026">
            </div>

            <div id="infoBox" class="info-box">
                <div class="label">💡 Ringkasan</div>
                <div class="value" id="totalInfo">Rp 0</div>
                <div class="detail" id="detailInfo">-</div>
            </div>

            <button class="btn btn-setor" id="prosesBtn" onclick="prosesTransaksi()">
                📤 PROSES
            </button>

            <div id="resultCard" class="result-card">
                <div id="resultContent"></div>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // ====== KONFIGURASI ======
        const API_URL = 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec';
        const API_TOKEN = 'JIMPITAN_DIGITAL_2024_SECRET_KEY';
        let nasabahList = [];
        let isProcessing = false;
        let jenisTransaksi = 'SETOR';

        // ====== INISIALISASI ======
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            document.getElementById('tanggalTransaksi').value = formatDateInput(today);
            loadData();
            document.getElementById('nasabahSelect').addEventListener('change', updateInfo);
            document.getElementById('nominalInput').addEventListener('input', updateInfo);
        });

        // ====== FUNGSI JENIS TRANSAKSI ======
        function setJenis(jenis) {
            jenisTransaksi = jenis;
            
            document.getElementById('btnSetor').className = 'jenis-btn' + (jenis === 'SETOR' ? ' active setor' : '');
            document.getElementById('btnTarik').className = 'jenis-btn' + (jenis === 'TARIK' ? ' active tarik' : '');
            
            const label = document.getElementById('nominalLabel');
            if (jenis === 'SETOR') {
                label.innerHTML = '💰 Nominal (SETOR)';
                label.style.color = '#64ffda';
            } else {
                label.innerHTML = '💰 Nominal (TARIK)';
                label.style.color = '#ff6b6b';
            }
            
            const btn = document.getElementById('prosesBtn');
            btn.className = 'btn ' + (jenis === 'SETOR' ? 'btn-setor' : 'btn-tarik');
            btn.innerHTML = (jenis === 'SETOR' ? '📤' : '📥') + ' PROSES';
            
            updateInfo();
        }

        // ====== FORMAT NOMINAL ======
        function formatNominal(input) {
            let value = input.value.replace(/[^\d]/g, '');
            if (value) {
                input.value = new Intl.NumberFormat('id-ID').format(parseInt(value));
            }
            updateInfo();
        }

        function getNominalValue() {
            const input = document.getElementById('nominalInput');
            return parseInt(input.value.replace(/[^\d]/g, '')) || 0;
        }

        // ====== LOAD DATA ======
        async function loadData() {
            try {
                showToast('🔄 Memuat data...');
                
                const res1 = await fetch(`${API_URL}?action=getNasabah`);
                const data1 = await res1.json();
                
                if (data1.status === 'success') {
                    nasabahList = data1.data || [];
                    const select = document.getElementById('nasabahSelect');
                    nasabahList.forEach(n => {
                        const opt = document.createElement('option');
                        opt.value = n.nama;
                        opt.textContent = n.nama;
                        select.appendChild(opt);
                    });
                }
                
                const res2 = await fetch(`${API_URL}?action=getAllSaldo`);
                const data2 = await res2.json();
                
                if (data2.status === 'success') {
                    document.getElementById('saldoCard').style.display = 'block';
                    document.getElementById('saldoGlobal').textContent = formatRupiah(data2.summary?.saldo_global || 0);
                    document.getElementById('totalNasabah').textContent = data2.summary?.total_nasabah || 0;
                }
                
                showToast(`✅ ${nasabahList.length} nasabah dimuat`);
            } catch (error) {
                showToast('❌ Gagal memuat data', true);
            }
        }

        // ====== UPDATE INFO ======
        function updateInfo() {
            const nama = document.getElementById('nasabahSelect').value;
            const nominal = getNominalValue();
            const infoBox = document.getElementById('infoBox');
            
            if (!nama || nominal <= 0) {
                infoBox.style.display = 'none';
                document.getElementById('prosesBtn').disabled = true;
                return;
            }
            
            const jenis = jenisTransaksi === 'SETOR' ? 'Setoran' : 'Penarikan';
            const highlightClass = jenisTransaksi === 'SETOR' ? 'highlight-setor' : 'highlight-tarik';
            
            infoBox.style.display = 'block';
            document.getElementById('totalInfo').textContent = formatRupiah(nominal);
            document.getElementById('detailInfo').innerHTML = 
                `${jenis} <span class="${highlightClass}">${formatRupiah(nominal)}</span> oleh ${nama}`;
            
            document.getElementById('prosesBtn').disabled = false;
        }

        // ====== PROSES TRANSAKSI ======
        async function prosesTransaksi() {
            if (isProcessing) return;
            
            const nama = document.getElementById('nasabahSelect').value;
            const tanggal = document.getElementById('tanggalTransaksi').value;
            const nominal = getNominalValue();
            const keterangan = document.getElementById('keteranganInput').value.trim();
            
            if (!nama) { showToast('❌ Pilih nasabah', true); return; }
            if (!tanggal) { showToast('❌ Pilih tanggal', true); return; }
            if (nominal <= 0) { showToast('❌ Masukkan nominal', true); return; }
            
            const jenisLabel = jenisTransaksi === 'SETOR' ? 'SETORAN' : 'PENARIKAN';
            const confirmMsg = `Konfirmasi ${jenisLabel}\n\nNasabah: ${nama}\nTanggal: ${formatTanggal(tanggal)}\nNominal: ${formatRupiah(nominal)}\n\nLanjutkan?`;
            
            if (!confirm(confirmMsg)) return;
            
            isProcessing = true;
            const btn = document.getElementById('prosesBtn');
            btn.innerHTML = '<span class="spinner"></span> Memproses...';
            btn.disabled = true;
            
            try {
                const action = jenisTransaksi === 'SETOR' ? 'addSetoran' : 'addPenarikan';
                const payload = new URLSearchParams({
                    action: action,
                    token: API_TOKEN,
                    nama: nama,
                    tanggal: tanggal,
                    nominal: nominal,
                    keterangan: keterangan || `${jenisLabel} ${formatTanggal(tanggal)}`
                });
                
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    showToast(`✅ ${data.message}`);
                    
                    const resultCard = document.getElementById('resultCard');
                    resultCard.classList.add('show');
                    
                    const highlightClass = jenisTransaksi === 'SETOR' ? 'highlight-setor' : 'highlight-tarik';
                    
                    document.getElementById('resultContent').innerHTML = `
                        <div style="text-align:center;margin-bottom:10px;color:#64ffda;font-weight:600;">✅ Berhasil</div>
                        <div class="result-item"><span class="label">ID</span><span class="value">${data.data.id}</span></div>
                        <div class="result-item"><span class="label">Nasabah</span><span class="value">${data.data.nama}</span></div>
                        <div class="result-item"><span class="label">Jenis</span><span class="value ${highlightClass}">${data.data.jenis}</span></div>
                        <div class="result-item"><span class="label">Tanggal</span><span class="value">${data.data.tanggal}</span></div>
                        <div class="result-item"><span class="label">Nominal</span><span class="value ${highlightClass}">${data.data.nominal_formatted}</span></div>
                    `;
                    
                    document.getElementById('nominalInput').value = '';
                    document.getElementById('keteranganInput').value = '';
                    document.getElementById('infoBox').style.display = 'none';
                    document.getElementById('prosesBtn').disabled = true;
                    
                    loadData();
                } else {
                    throw new Error(data.message || 'Gagal');
                }
            } catch (error) {
                showToast(`❌ ${error.message}`, true);
            }
            
            isProcessing = false;
            btn.innerHTML = (jenisTransaksi === 'SETOR' ? '📤' : '📥') + ' PROSES';
            btn.disabled = false;
        }

        // ====== UTILITY ======
        function formatRupiah(num) { return 'Rp ' + (num || 0).toLocaleString('id-ID'); }
        function formatNumber(num) { return (num || 0).toLocaleString('id-ID'); }
        function formatDateInput(date) {
            return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
        }
        function formatTanggal(tanggalStr) {
            try {
                const parts = tanggalStr.split('-');
                if (parts.length === 3) {
                    return `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
                const date = new Date(tanggalStr);
                return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
            } catch { return tanggalStr; }
        }

        function showToast(message, isError = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast' + (isError ? ' error' : '');
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(16px)';
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }
    </script>
</body>
</html>
